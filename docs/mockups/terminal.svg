<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Pumpkky terminal split mockup">
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
  <rect x="0" y="0" width="900" height="38" rx="14" fill="#1a1a1a"/>
  <rect x="0" y="24" width="900" height="14" fill="#1a1a1a"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" fill="#888" font-family="-apple-system,sans-serif" font-size="12">myproject — Pumpkky</text>
  <rect x="0" y="38" width="200" height="562" fill="#0d0d0d"/>
  <text x="18" y="68" fill="#e37e29" font-family="ui-monospace,monospace" font-size="11" font-weight="700">FILES</text>
  <!-- editor -->
  <rect x="200" y="38" width="700" height="340" fill="#0a0a0a"/>
  <g font-family="ui-monospace,monospace" font-size="13" fill="#a0a0a0">
    <text x="220" y="78">  1  zig build run</text>
    <text x="220" y="102">  2</text>
    <text x="220" y="126">  3  // editing main.zig...</text>
  </g>
  <!-- divider -->
  <rect x="200" y="378" width="700" height="2" fill="#232323"/>
  <!-- terminal -->
  <rect x="200" y="380" width="700" height="220" fill="#000"/>
  <g font-family="ui-monospace,monospace" font-size="12">
    <text x="218" y="404" fill="#e37e29">$ zig build run</text>
    <text x="218" y="424" fill="#a0a0a0">[2/3] Compile editor</text>
    <text x="218" y="444" fill="#a0a0a0">[3/3] Link pumpkky</text>
    <text x="218" y="464" fill="#e8e8e8">Pumpkky 0.1.0-mvp ready.</text>
    <text x="218" y="488" fill="#e37e29">$ pumpkky --help</text>
    <text x="218" y="508" fill="#a0a0a0">  open &lt;path&gt;   open a folder/file</text>
    <text x="218" y="528" fill="#a0a0a0">  config        edit ~/.config/ghostty-editor/config</text>
    <text x="218" y="548" fill="#a0a0a0">  version       show version</text>
    <text x="218" y="572" fill="#e37e29">$ <tspan fill="#e8e8e8" font-weight="700">█</tspan></text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Pumpkky URL preview tab mockup">
  <rect x="0" y="0" width="900" height="600" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
  <rect x="0" y="0" width="900" height="38" rx="14" fill="#1a1a1a"/>
  <rect x="0" y="24" width="900" height="14" fill="#1a1a1a"/>
  <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="19" r="6" fill="#febc2e"/>
  <circle cx="62" cy="19" r="6" fill="#28c840"/>
  <text x="450" y="24" text-anchor="middle" fill="#888" font-family="-apple-system,sans-serif" font-size="12">myproject — Pumpkky</text>
  <rect x="0" y="38" width="200" height="562" fill="#0d0d0d"/>
  <!-- tab strip -->
  <rect x="200" y="38" width="700" height="34" fill="#141414"/>
  <text x="220" y="59" fill="#666" font-family="ui-monospace,monospace" font-size="11">main.zig</text>
  <rect x="290" y="38" width="220" height="34" fill="#0a0a0a"/>
  <text x="310" y="59" fill="#e37e29" font-family="ui-monospace,monospace" font-size="11">● localhost:3000</text>
  <text x="525" y="59" fill="#666" font-family="ui-monospace,monospace" font-size="11">+</text>
  <!-- url bar -->
  <rect x="200" y="80" width="700" height="40" fill="#141414"/>
  <rect x="216" y="88" width="28" height="24" rx="4" fill="#1f1f1f"/>
  <text x="230" y="105" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system,sans-serif" font-size="14">←</text>
  <rect x="248" y="88" width="28" height="24" rx="4" fill="#1f1f1f"/>
  <text x="262" y="105" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system,sans-serif" font-size="14">→</text>
  <rect x="280" y="88" width="28" height="24" rx="4" fill="#1f1f1f"/>
  <text x="294" y="106" text-anchor="middle" fill="#a0a0a0" font-family="-apple-system,sans-serif" font-size="14">⟳</text>
  <rect x="318" y="88" width="566" height="24" rx="4" fill="#1f1f1f"/>
  <text x="330" y="105" fill="#e8e8e8" font-family="ui-monospace,monospace" font-size="11">http://localhost:3000/</text>
  <!-- web view -->
  <rect x="200" y="120" width="700" height="480" fill="#fcfcfc"/>
  <text x="550" y="180" text-anchor="middle" fill="#1a1a1a" font-family="-apple-system,sans-serif" font-size="32" font-weight="700">Hello, dev server</text>
  <text x="550" y="218" text-anchor="middle" fill="#666" font-family="-apple-system,sans-serif" font-size="14">previewed inside Pumpkky, no browser switch</text>
  <rect x="450" y="260" width="200" height="44" rx="6" fill="#e37e29"/>
  <text x="550" y="288" text-anchor="middle" fill="#1a0d05" font-family="-apple-system,sans-serif" font-size="14" font-weight="700">Try the demo</text>
  <g fill="#e8e8e8">
    <rect x="350" y="340" width="120" height="80" rx="6" stroke="#ddd"/>
    <rect x="490" y="340" width="120" height="80" rx="6" stroke="#ddd"/>
    <rect x="630" y="340" width="120" height="80" rx="6" stroke="#ddd"/>
  </g>
  <g fill="#999" font-family="-apple-system,sans-serif" font-size="11">
    <text x="410" y="385" text-anchor="middle">Feature A</text>
    <text x="550" y="385" text-anchor="middle">Feature B</text>
    <text x="690" y="385" text-anchor="middle">Feature C</text>
  </g>
</svg>

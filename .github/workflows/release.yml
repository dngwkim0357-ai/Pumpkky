name: Release (tag → dmg → GitHub Release)

on:
  push:
    tags:
      - 'v*'

jobs:
  release-macos:
    name: Build & publish unsigned dmg
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Force Node.js 24 (per CCAGI policy 2026-05-23)
        run: echo "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true" >> $GITHUB_ENV

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build .app bundle
        run: ./scripts/build-macos.sh

      - name: Pack dmg
        run: ./scripts/make-dmg.sh "${{ github.ref_name }}"

      - name: Create GitHub Release & upload dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Ghostty Code Editor Studio ${{ github.ref_name }} — unsigned dmg.

          See README.md for Gatekeeper bypass instructions on first launch." \
            --draft \
            "dist/Ghostty-Editor-${{ github.ref_name }}.dmg"
